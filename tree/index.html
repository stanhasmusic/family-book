<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

<title>The Moore Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --gilt: #d2b172; --on: #eadcc0; --soft: #b4a081; --err: #f0a080;
  --serif: "EB Garamond", Garamond, Georgia, serif; --display: "Cormorant Garamond", Garamond, Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--serif); color: var(--on);
  background: radial-gradient(ellipse at 50% 38%, rgba(120, 78, 44, .42), transparent 62%), linear-gradient(180deg, #2a1c12, #120c08);
  background-color: #120c08;
  display: grid; place-items: center; padding: 16px;
}
.card {
  width: min(420px, 100%); text-align: center; padding: 34px 26px 28px;
  border: 1px solid rgba(210, 177, 114, .3); border-radius: 14px; background: rgba(0, 0, 0, .22);
  box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
}
.orn { color: var(--gilt); font-size: 22px; letter-spacing: .5em; margin-bottom: 6px; }
h1 { margin: 0; font-family: var(--display); font-weight: 700; color: var(--gilt); letter-spacing: .14em; text-transform: uppercase; font-size: 26px; }
.sub { font-style: italic; color: var(--soft); margin: 6px 0 24px; font-size: 17px; }
p.lead { margin: 0 0 16px; font-size: 17.5px; line-height: 1.45; }
input[type=password], input[type=text] {
  width: 100%; font: inherit; font-size: 19px; padding: 12px 14px; border-radius: 10px;
  border: 1px solid rgba(210, 177, 114, .45); background: rgba(255, 255, 255, .06); color: var(--on); outline: none; text-align: center;
}
input:focus { border-color: var(--gilt); background: rgba(255, 255, 255, .09); }
label.row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 14px 0 18px; color: var(--soft); font-size: 16px; cursor: pointer; }
label.row input { width: 18px; height: 18px; accent-color: var(--gilt); }
button {
  width: 100%; font: inherit; font-size: 19px; font-weight: 500; padding: 12px; border-radius: 999px; cursor: pointer;
  border: 0; background: var(--gilt); color: #24180f; letter-spacing: .03em;
}
button:disabled { opacity: .6; cursor: default; }
.msg { min-height: 1.5em; margin-top: 14px; font-size: 16px; color: var(--soft); font-style: italic; }
.msg.err { color: var(--err); font-style: normal; }
.fine { margin-top: 18px; font-size: 14px; color: var(--soft); font-style: italic; line-height: 1.4; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="orn">❦</div>
  <h1>The Moore Family</h1>
  <div class="sub">The family tree</div>
  <p class="lead">This is private to the family.<br>Please enter the family password.</p>
  <input type="text" name="username" value="Moore family" autocomplete="username" hidden>
  <input type="password" id="pw" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Family password" aria-label="Family password" required>
  <label class="row"><input type="checkbox" id="remember" checked> Remember on this device</label>
  <button id="go" type="submit">Open</button>
  <div class="msg" id="msg"></div>
  <div class="fine">Capital letters, spaces and dashes don’t matter.</div>
</form>

  function bytes(b64) {

    return;
  }

  // Returning visitor on a remembered device.
  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved) {
    say('Opening…');
    openWithKey(bytes(saved)).then(show).catch(function () {
      try { localStorage.removeItem(STORE); } catch (e) {}
      say('');
    });
  }

  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    if (!pw.trim()) return;
    btn.disabled = true; say('Unlocking…');
    try {
      var raw = await deriveKey(pw);
      var html = await openWithKey(raw);
      if (document.getElementById('remember').checked) {
        try { localStorage.setItem(STORE, b64(raw)); } catch (e2) {}
      }
      show(html);
    } catch (err) {
      btn.disabled = false;
      say('That password didn’t work. Please check it and try again.', true);
      document.getElementById('pw').select();
    }
  });
})();
</script>
</body>
</html>
